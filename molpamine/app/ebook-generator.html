<title>전자책 생성기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a writing desk. Sticky header with progress, a 6-step rail, one working panel per step. */
:root{
  --bg:#EDF0EC; --surface:#FBFCFA; --surface-2:#E3E8E2; --line:#CDD5CC;
  --ink:#1B2420; --ink-2:#4E5B55; --ink-3:#83908A;
  --accent:#0E6655; --accent-ink:#FFFFFF; --accent-soft:#D5EAE3;
  --mark:#F3D35B; --mark-ink:#3E3000;
  --warn:#A3591B; --warn-soft:#F7E6D3;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111513; --surface:#181E1B; --surface-2:#212925; --line:#2E3833;
    --ink:#E3EAE6; --ink-2:#A6B3AC; --ink-3:#6F7D76;
    --accent:#56C2A6; --accent-ink:#06231B; --accent-soft:#183A31;
    --mark:#E2C24A; --mark-ink:#241B00;
    --warn:#E3A266; --warn-soft:#3A2717;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111513; --surface:#181E1B; --surface-2:#212925; --line:#2E3833;
  --ink:#E3EAE6; --ink-2:#A6B3AC; --ink-3:#6F7D76;
  --accent:#56C2A6; --accent-ink:#06231B; --accent-soft:#183A31;
  --mark:#E2C24A; --mark-ink:#241B00;
  --warn:#E3A266; --warn-soft:#3A2717;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:14px 0}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand h1{font-family:var(--f-display);font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}
.brand .book{color:var(--ink-2);font-size:14px;min-width:0}
.brand .book b{color:var(--ink);font-weight:500}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.saved{font-size:12px;color:var(--ink-3);margin-right:auto}
.prog{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.prog .track{width:120px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog .fill{display:block;height:100%;background:var(--accent);transition:width .3s}
button,.btn{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;line-height:1.3}
button:hover{border-color:var(--ink-3)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.armed{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{border-color:transparent;background:transparent;color:var(--ink-2);padding:6px 8px}
nav.rail{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:2px}
nav.rail::-webkit-scrollbar{display:none}
.step{flex:1 0 112px;text-align:left;border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 6px 9px;color:var(--ink-3)}
.step .n{display:block;font-family:var(--f-mono);font-size:11px}
.step .l{display:block;font-size:13px;font-weight:500;white-space:nowrap}
.step.on{color:var(--ink);border-bottom-color:var(--accent)}
.step.done .n::after{content:" ✓";color:var(--accent)}
main{padding-block:24px 64px}
.panel{display:flex;flex-direction:column;gap:20px}
.head h2{font-family:var(--f-display);font-size:24px;margin:0 0 4px;text-wrap:balance}
.head p{margin:0;color:var(--ink-2);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--ink-2);min-width:0}
label.f .hint{font-weight:400;color:var(--ink-3);font-size:12px}
input[type=text],textarea,select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px;line-height:1.65}
textarea.tall{min-height:420px}
textarea.mid{min-height:220px}
.lab{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:13px;color:var(--ink-2);min-height:1.2em}
.status.err{color:var(--warn)}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt small{display:block;color:var(--ink-3);font-size:12px}
.chapters{display:flex;flex-direction:column;gap:10px}
.chap{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.chap .no{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);padding-top:10px}
.chap .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.chap .tools{display:flex;flex-direction:column;gap:4px}
.qs{display:flex;flex-direction:column;gap:6px}
.qs input{font-size:13px}
.writer{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}
.clist{display:flex;flex-direction:column;gap:4px;position:sticky;top:150px}
.citem{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid transparent;background:none;padding:9px 10px;border-radius:10px;width:100%}
.citem .t{font-size:13px;font-weight:500;color:var(--ink);line-height:1.35}
.citem.on{background:var(--surface);border-color:var(--line)}
.chip{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.chip.memo{background:var(--accent-soft);color:var(--accent)}
.chip.draft{background:var(--warn-soft);color:var(--warn)}
.chip.done{background:var(--mark);color:var(--mark-ink)}
.memo-q{font-size:14px;font-weight:500;color:var(--ink)}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.prose{font-family:var(--f-display);font-size:16px;line-height:1.9;max-width:66ch}
.prose h1{font-size:24px;line-height:1.4;margin:0 0 18px;text-wrap:balance}
.prose h2{font-size:19px;margin:28px 0 10px}
.prose h3{font-size:16px;margin:22px 0 8px}
.prose p{margin:0 0 14px}
.prose blockquote{margin:0 0 14px;padding:10px 16px;background:var(--surface-2);border-radius:8px}
.prose blockquote p{margin:0}
.prose hr{border:none;border-top:1px solid var(--line);margin:24px 0}
.prose table{border-collapse:collapse;font-family:var(--f-body);font-size:14px;margin:0 0 14px}
.prose th,.prose td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--surface-2)}
.tbl{overflow-x:auto;max-width:100%}
.prose ul,.prose ol{margin:0 0 14px;padding-left:1.4em}
.covers{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.cover{aspect-ratio:210/297;max-width:100%;width:280px;border-radius:6px;padding:28px 24px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden}
.cover .ct{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1.1;letter-spacing:-.02em;word-break:keep-all}
.cover .cs{font-size:14px;line-height:1.5;margin-top:12px;word-break:keep-all}
.cover .rule{width:40px;height:4px;margin-top:18px}
.cover .ca{font-size:13px;font-weight:500}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;font-size:13px}
.sw.sel{border-color:var(--accent);background:var(--accent-soft)}
.sw i{display:inline-flex;width:34px;height:20px;border-radius:4px;overflow:hidden}
.sw i b{flex:1}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.colors label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.colors input[type=color]{width:36px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .v{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--ink-3)}
.bookview{background:var(--surface-2);border-radius:12px;padding:20px;max-height:640px;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:16px}
.page{background:var(--surface);width:100%;max-width:620px;padding:36px 34px;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:760px){
  .writer,.covers{grid-template-columns:1fr}
  .clist{position:static;flex-direction:row;overflow-x:auto}
  .citem{min-width:150px}
  .cover{width:100%}
  .chap{grid-template-columns:1fr}
  .chap .no{padding:0}
  .chap .tools{flex-direction:row}
  .prog .track{width:80px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>전자책 생성기</h1>
      <span class="book" id="bookline"></span>

    <div class="bar">

      <button id="btn-save" type="button">작업 파일로 저장</button>
      <button id="btn-load" type="button">작업 파일 불러오기</button>
      <button id="btn-new" type="button" data-confirm="새로 시작하면 지금 작업이 지워져요. 한 번 더 누르세요">새로 시작</button>
      <input type="file" id="file-in" accept=".json,application/json" hidden>
    </div>
    <nav class="rail" id="rail" aria-label="단계"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>

<script type="application/json" id="seed">{"v": 1, "step": 3, "cur": 5, "mode": "edit", "cards": {"know": "몰입하는 방법", "fun": "요새 브레인포그, 도파민 중독 등 집중력 저하가 많은데 이것을 뇌과학으로 재밌게 풀어내 보는 것", "weak": "우울증, 지인들의 뒤통수, 마음 약한 약점, 대인기피증, 불안장애 등", "healed": "뇌가 어떻게 해석하느냐에 따라 달린 것", "hard": "감정기복"}, "topic": {"core": "뇌의 해석을 바꿔 흐려진 집중과 흔들리는 감정을 되찾는다", "promise": "이 책을 다 읽은 사람은 폰 도파민 대신 몰파민으로 하루 1시간 깊이 몰입할 수 있게 된다.", "title": "몰파민", "subtitle": "폰에 빼앗긴 뇌를 몰입으로 되찾는 법", "reader": "퇴근하고 누우면 폰만 보다가 '오늘도 아무것도 못 했다'며 자책하는 20~30대", "author": ""}, "topicDraft": null, "research": "**써도 되는 것 (출처 확인 후 인용)**\n- 도파민은 \"쾌락 물질\"이라기보다 **원하게 만들고 다음 보상을 예측하는** 물질에 가깝다 (보상 예측 오차 연구, Schultz).\n- 몰입(flow)은 **과제 난이도와 실력이 맞을 때** 잘 일어난다 (칙센트미하이).\n- 일을 바꿀 때 앞 일에 주의가 남아 집중이 떨어진다 – **주의 잔여(attention residue)** (Sophie Leroy, 2009).\n- 생각을 다르게 해석하는 연습(인지 재평가)이 감정 반응을 바꾼다 (Gross의 감정 조절 연구).\n\n**피할 것 (반박당하기 쉬움)**\n- \"도파민 디톡스로 도파민을 끊는다\" → 도파민은 끊을 수 없다. 대신 \"얻는 길을 바꾼다\"로 쓴다.\n- \"몰입하면 신경물질이 4단계로 나온다\" 같은 근거 불명확한 공식.\n- \"브레인포그\"를 의학 진단처럼 쓰는 것 → \"머리가 뿌옇게 느껴지는 상태\"라는 생활 표현으로 쓴다.", "toc": [{"title": "프롤로그 – 나는 집중을 못 하는 사람인 줄 알았다", "card": "겪은 약점", "goal": "집중 못 하는 게 내 탓이 아니라는 걸 알게 된다", "questions": ["중요한 일을 앞두면 어떻게 되나요?", "그때 대신 하고 싶어지는 건?", "그때 나에게 했던 생각은?"], "memo": ["중요한 할 일을 공부하려면 하기가 싫어진다 / 쇼핑 앱", "오히려 다른 걸 하고 싶어진다", "나는 왜 이럴까? 처음엔 ADHD인 줄 알았다. 검사는 세 곳에서 받아 봤다. 한 곳은 맞다, 두 곳은 아니다"], "draft": "# 프롤로그 – 나는 집중을 못 하는 사람인 줄 알았다\n\n중요한 일일수록 이상하게 손이 안 갔어요.\n\n책상에 앉아 공부를 시작하려는 그 순간, 갑자기 하기가 싫어졌어요. 정말 신기한 건 그다음이었어요. 평소엔 필요하지도 않던 일이 갑자기 하고 싶어지는 거예요.\n\n제 경우엔 쇼핑 앱이었어요. 사려던 것도 없는데 앱을 열고, 내리고, 또 내리고. 장바구니에 담았다 뺐다 하다 보면 한두 시간이 그냥 사라져 있었어요. 공부는 펴 놓은 그대로였고요.\n\n그렇게 하루가 끝나면 남는 건 늘 같은 질문이었어요.\n\n**\"나는 왜 이럴까?\"**\n\n처음엔 ADHD인 줄 알았어요. 차라리 이름이 붙으면 마음이 편할 것 같았거든요. 내가 게으른 게 아니라, 뇌가 원래 그런 거라고.\n\n그래서 직접 검사를 받아 봤어요. 그것도 세 곳에서요.\n한 곳은 맞다고 했고, 두 곳은 아니라고 했어요.\n\n답을 얻으러 갔는데, 질문만 더 커져서 돌아왔어요. 맞는 걸까, 아닌 걸까. 그 사이에서 한참을 헤맸어요. 그러다 어느 날 이런 생각이 들었어요.\n\n**이름이 무엇이든, 내일 아침 책상 앞의 나는 똑같다.**\n\n진단명을 붙이는 건 전문가의 몫이에요. 제가 할 수 있는 건 따로 있었어요. 내 뇌가 왜 그 순간 쇼핑 앱으로 도망가는지 이해하고, 다른 길을 만들어 주는 것.\n\n그래서 뇌를 공부하기 시작했고, 알게 된 게 있어요.\n\n**그 \"하기 싫음\"은 고장이 아니라, 뇌가 나를 지키려고 보낸 신호였어요.**\n\n중요한 일 앞에는 늘 불편한 감정이 같이 서 있어요. 잘 해야 한다는 부담, 못 하면 어쩌나 하는 불안, 막막함. 뇌는 이 불편함을 '위험'으로 해석해요. 그리고 가장 빠른 탈출구를 찾아요. 바로 지금 당장 기분이 나아지는 것, 손가락 하나로 도파민이 나오는 것들이요. 제게는 그게 쇼핑 앱이었던 거예요.\n\n실제로 미루기를 연구하는 심리학자들은 미루기를 **시간 관리 문제가 아니라 감정 조절 문제**로 봐요. 우리는 일을 피하는 게 아니라, 그 일에 붙어 있는 *불편한 기분*을 피하는 거예요.\n\n그러니까 문제는 내가 집중을 못 하는 사람이라는 게 아니었어요.\n**내 뇌가 도파민을 얻는 길을 하나밖에 몰랐던 거예요.** 빠르고, 쉽고, 금방 꺼지는 길.\n\n이 책은 그 다른 길에 대한 이야기예요.\n천천히 차오르지만 오래가는 도파민. 하나에 깊이 빠져들 때 뇌가 주는 보상. 저는 그걸 **몰파민**이라고 불러요.\n\n우울하고, 사람이 무섭고, 머리가 늘 뿌옇던 시간을 지나며 저는 한 가지를 배웠어요. 뇌는 바뀌지 않아도 **뇌의 해석은 바뀔 수 있다**는 것. 그리고 해석이 바뀌면 같은 하루가 전혀 다르게 흘러간다는 것.\n\n이 책을 다 읽고 나면, 당신도 폰 도파민 대신 몰파민으로 하루 1시간 깊이 몰입할 수 있게 될 거예요.\n\n먼저, 왜 우리는 아무것도 하지 않았는데도 이렇게 지치는지부터 이야기해 볼게요.\n\n---\n\n> *이 책은 의학적 진단이나 치료를 대신하지 않아요. 집중의 어려움이 오래 이어지고 일상에 큰 지장을 준다면 전문가의 상담을 받아 보시길 권해요. ADHD 여부는 전문의의 평가로만 알 수 있어요. 저자의 경험처럼 기관마다 판단이 다를 수 있으니, 궁금하다면 신뢰할 수 있는 전문의와 충분히 상담해 보세요.*\n\n---\n### 근거 메모 (본문 인용 전 원문 확인)\n- 미루기 = 단기 기분 회복을 위한 감정 조절 실패: Sirois & Pychyl (2013), \"Procrastination and the priority of short-term mood regulation\", *Social and Personality Psychology Compass*.\n", "done": true}, {"title": "1장 – 왜 우리는 아무것도 못 하면서 지칠까: 브레인포그의 정체", "card": "재밌게 할 수 있는 분야", "goal": "글자가 안 들어오는 진짜 이유를 안다", "questions": ["머리가 가장 뿌옇다고 느낀 순간은?", "그때 몸이나 머리는 어떤 느낌이었나요?", "그때 자신에게 했던 말 한 문장은?"], "memo": ["공부하려고 책 펴면 글자가 안 들어온다", "머리는 답답이라고 해야 하나", "난 왜 중요한 순간마다 이럴까"], "draft": "# 1장 – 왜 우리는 아무것도 못 하면서 지칠까: 브레인포그의 정체\n\n공부하려고 책을 폈어요.\n\n첫 줄을 읽었어요. 그런데 글자가 안 들어와요. 눈은 분명 문장을 따라가고 있는데, 다 읽고 나면 아무것도 남아 있지 않아요. 다시 첫 줄로 돌아가요. 또 읽어요. 또 안 들어와요.\n\n머리는 뭐라고 해야 할까요. **답답했어요.** 아픈 건 아닌데, 꽉 막힌 방에 갇힌 것 같은 느낌. 생각을 하려고 하면 안개 속을 헤매는 것처럼 아무것도 잡히지 않았어요.\n\n그리고 꼭 이런 순간은 중요한 때 찾아왔어요. 시험 전, 마감 전, 정말 잘 해내야 하는 날.\n\n**\"난 왜 중요한 순간마다 이럴까.\"**\n\n사람들은 이런 상태를 '브레인포그'라고 불러요. 머리에 안개가 낀 것 같다는 뜻이에요. 정식 병명은 아니지만, 이 말이 이렇게 널리 퍼진 건 그만큼 많은 사람이 같은 걸 겪고 있다는 뜻이겠죠.\n\n저는 오랫동안 이걸 머리가 나빠서, 혹은 의지가 약해서라고 생각했어요. 그런데 뇌를 공부하면서 해석이 완전히 뒤집혔어요.\n\n**글자가 안 들어오는 건 머리가 비어서가 아니라, 머리가 이미 꽉 차 있어서였어요.**\n\n---\n\n## 뇌의 작업대는 생각보다 작아요\n\n우리 뇌에는 '작업 기억'이라는 공간이 있어요. 지금 이 순간 생각을 올려놓고 굴리는 작업대 같은 곳이에요. 책의 문장을 이해하는 것도, 계산을 하는 것도 다 이 작업대 위에서 일어나요.\n\n문제는 이 작업대가 **아주 작다**는 거예요. 한 번에 올려놓을 수 있는 건 몇 가지뿐이에요.\n\n그런데 중요한 순간의 작업대 위를 한번 들여다볼까요.\n\n- \"이번에 못 하면 어떡하지\" (불안)\n- \"아까 장바구니에 담아둔 거 아직 할인하나\" (방금 보던 폰)\n- \"나는 왜 맨날 이럴까\" (자책)\n- 그리고 겨우 남은 귀퉁이에… 책의 첫 문장\n\n**책이 들어갈 자리가 없었던 거예요.**\n\n심리학자들은 이걸 실제로 연구했어요. 불안이 높아지면 걱정이 작업 기억의 자리를 차지해서, 정작 해야 할 일에 쓸 주의력이 줄어든다는 거예요. 중요한 순간일수록 불안이 커지니까, 중요한 순간일수록 글자가 안 들어오는 건 어쩌면 당연한 결과였어요.\n\n## 방금 보던 폰은 머릿속에 남아 있어요\n\n하나가 더 있어요.\n\n쇼핑 앱을 닫고 책을 폈다고 해서, 머리도 같이 책으로 넘어오는 건 아니에요. 한 일에서 다른 일로 옮겨 갈 때, 앞의 일에 쓰던 주의력 일부가 한동안 머릿속에 남아 있어요. 연구자들은 이걸 **'주의 잔여'**라고 불러요. 마치 앞사람이 쓰고 치우지 않은 책상에 앉은 것과 비슷해요.\n\n그러니까 \"폰 조금만 보고 공부해야지\"는 생각보다 비싼 거래예요. 폰을 본 시간만큼이 아니라, 그 뒤로 한동안 머리가 덜 돌아가는 시간까지 같이 내야 하거든요.\n\n## 그래서 아무것도 안 했는데 지쳐요\n\n이제 그 이상한 피로가 이해되기 시작했어요.\n\n몸은 하루 종일 의자에 앉아만 있었는데 왜 그렇게 지쳤을까요. 뇌는 쉬지 않았거든요. 불안을 붙잡고, 자책을 굴리고, 폰과 책 사이를 오가면서, 작은 작업대 위에서 하루 종일 짐을 들었다 놨다 하고 있었던 거예요.\n\n**아무것도 못 한 하루가 아니라, 보이지 않는 일을 너무 많이 한 하루였어요.**\n\n이걸 알고 나서 저는 저 자신을 조금 덜 미워하게 됐어요. 그리고 질문이 바뀌었어요. \"나는 왜 이럴까\"에서, **\"내 작업대를 어떻게 비울까\"**로요.\n\n---\n\n## 오늘의 몰파민 행동: 2분 머릿속 비우기\n\n책을 펴기 전에, 딱 2분만 이렇게 해 보세요.\n\n1. **폰을 다른 방에 둬요.** 뒤집어 놓는 걸로는 부족해요. 눈에 안 보이는 곳으로요.\n2. **종이 한 장에 지금 머릿속에 있는 걸 전부 적어요.** 걱정, 해야 할 일, 사고 싶은 것, \"나는 왜 이럴까\"까지. 문장이 아니어도 괜찮아요.\n3. 다 적었으면 종이를 접어서 옆에 둬요. **\"이건 나중에 처리할게\"** 하고요.\n\n시험 직전에 걱정을 글로 적게 했더니 성적이 올라갔다는 연구가 있어요. 걱정을 종이로 옮기면 작업대에서 짐 하나를 내려놓는 셈이에요.\n\n작업대가 조금 비워지면, 첫 문장이 들어올 자리가 생겨요.\n\n---\n\n그런데 여기서 질문이 하나 남아요. 머릿속이 이렇게 답답할 때, 왜 하필 뇌는 폰을 집어 들까요? 왜 쇼핑 앱은 이렇게 쉽게 들어오는데 책은 안 들어올까요?\n\n그 답은 우리가 오해해 온 물질, 도파민에 있어요.\n\n---\n### 근거 메모 (본문 인용 전 원문 확인)\n- 작업 기억 용량의 한계: Cowan (2001), \"The magical number 4 in short-term memory\", *Behavioral and Brain Sciences*.\n- 불안이 작업 기억·주의 통제를 잠식: Eysenck, Derakshan, Santos & Calvo (2007), \"Anxiety and cognitive performance: Attentional control theory\", *Emotion*.\n- 주의 잔여: Leroy (2009), \"Why is it so hard to do my work? The challenge of attention residue when switching between work tasks\", *Organizational Behavior and Human Decision Processes*.\n- 시험 전 걱정 글쓰기: Ramirez & Beilock (2011), \"Writing about testing worries boosts exam performance in the classroom\", *Science*.\n- '브레인포그'는 의학적 진단명이 아니라 생활 표현으로만 사용.\n", "done": true}, {"title": "2장 – 도파민은 죄가 없다: 빠른 도파민과 느린 도파민", "card": "재밌게 할 수 있는 분야", "goal": "빠른 도파민과 느린 도파민을 구분한다", "questions": ["쇼핑 앱을 열기 직전 기분은?", "앱을 보는 동안 기분은?", "앱을 닫고 난 뒤 기분은?"], "memo": ["할 일이 막막하고 불안했다", "잠깐 편했다", "후회됐다"], "draft": "# 2장 – 도파민은 죄가 없다: 빠른 도파민과 느린 도파민\n\n그 장면을 천천히 다시 돌려 볼게요.\n\n책상 앞이에요. 해야 할 일이 있어요. 그런데 그 일이 너무 **막막하고, 불안했어요.** 어디서부터 시작해야 할지 모르겠고, 시작해도 잘 못 할 것 같았어요.\n\n그 순간 손이 폰으로 가요. 쇼핑 앱을 열어요.\n\n그러자 **잠깐 편해졌어요.** 화면을 내리는 동안은 막막함도, 불안도 잠시 꺼졌어요. 예쁜 물건, 할인 표시, 장바구니. 머리가 처음으로 쉬는 것 같았어요.\n\n그리고 앱을 닫았을 때. 시간은 한참 지나 있었고, 할 일은 그대로였어요.\n\n**후회됐어요.**\n\n막막함 → 편안함 → 후회. 이 세 장면이 하루에도 몇 번씩 반복됐어요. 그때마다 저는 생각했어요. \"도파민 중독이야. 도파민을 끊어야 해.\"\n\n그런데 그건 틀린 해석이었어요.\n\n**도파민은 저를 망가뜨린 범인이 아니었어요. 저를 움직이게 하는 연료였는데, 그 연료가 한 길로만 흐르고 있었던 거예요.**\n\n---\n\n## 도파민은 '쾌락 물질'이 아니에요\n\n도파민 하면 흔히 '기분 좋게 하는 물질'을 떠올려요. 그런데 연구자들이 들여다본 도파민은 조금 달라요.\n\n도파민은 **\"저거 갖고 싶다, 저쪽으로 가자\"** 하고 나를 움직이게 하는 쪽에 더 가까워요. 좋아하는 것(좋다)과 원하는 것(갖고 싶다)은 뇌에서 다른 일이고, 도파민은 주로 **원하게 만드는** 쪽을 맡아요.\n\n그리고 도파민은 특히 **'예상보다 좋은 일'**에 크게 반응해요. 뻔한 보상보다, 나올지 안 나올지 모르는 보상에 더 들썩여요.\n\n이제 쇼핑 앱을 다시 볼까요. 다음에 뭐가 나올지 몰라요. 내리면 새 물건, 또 내리면 깜짝 할인. 이건 뇌에게 **'예상 못 한 보상이 계속 나오는 기계'**예요. 실제로 사람들이 물건을 볼 때, 사기 전부터 이미 뇌의 보상 영역이 반응한다는 연구도 있어요.\n\n제가 쇼핑 앱에서 아무것도 사지 않았는데도 한두 시간을 머문 이유가 여기 있었어요. 뇌가 원한 건 물건이 아니라, **'다음 화면'**이었어요.\n\n## 진짜 보상은 '불안이 꺼지는 것'이었어요\n\n그런데 그것만으로는 설명이 안 되는 게 있어요. 왜 하필 **할 일이 막막하고 불안할 때** 손이 갔을까요?\n\n다시 그 첫 장면으로 가 볼게요. 앱을 열자 \"잠깐 편했다\". 뇌가 배운 건 이거예요.\n\n> 불안할 때 → 폰을 열면 → 불안이 꺼진다.\n\n괴로운 게 사라지는 것도 뇌에게는 아주 강한 보상이에요. 이게 반복되면 뇌는 지름길을 만들어요. **불안 = 폰.** 생각하기도 전에 손이 먼저 가는 이유예요.\n\n그러니까 프롤로그에서 말한 것처럼, 저는 공부를 피한 게 아니었어요. **막막함과 불안을 피한 거였어요.** 쇼핑 앱은 그걸 가장 빨리 꺼 주는 버튼이었을 뿐이고요.\n\n## 빠른 길과 느린 길\n\n이제 이 책의 가장 중요한 그림을 그려 볼게요.\n\n도파민이 나를 움직이게 하는 길은 크게 두 가지예요.\n\n| | 빠른 도파민 | 느린 도파민 |\n|---|---|---|\n| 어디서 | 폰, 쇼핑 앱, 쇼츠, 알림 | 하나에 빠져드는 일, 조금씩 나아지는 일 |\n| 얼마나 걸리나 | 1초 | 10분, 30분, 며칠 |\n| 노력 | 손가락 하나 | 처음엔 버거움 |\n| 끝난 뒤 | 후회, 더 큰 공허 | 뿌듯함, \"또 하고 싶다\" |\n\n빠른 길은 나쁜 게 아니에요. 지친 날 잠깐 쉬는 데는 도움이 돼요. 문제는 **불안할 때마다 이 길만 쓰다 보면, 뇌가 다른 길을 잊어버린다**는 거예요. 느린 길은 처음 10분이 버겁기 때문에, 1초짜리 길과 경쟁하면 늘 져요.\n\n그래서 저는 도파민을 끊는 게 아니라, **도파민이 흐르는 길을 하나 더 내기로** 했어요. 처음엔 오솔길처럼 좁고 불편하지만, 자주 걸을수록 넓어지는 길이요.\n\n그 느린 길을 저는 **몰파민**이라고 불러요. 몰입이 주는 도파민이라는 뜻으로 제가 붙인 이름이에요.\n\n---\n\n## 오늘의 몰파민 행동: 손이 폰으로 갈 때 10초 멈추기\n\n폰을 끊으라는 게 아니에요. 딱 10초만, 자동으로 흐르는 길에 끼어들어 보는 거예요.\n\n1. **손이 폰으로 갈 때, 멈추고 지금 기분에 이름을 붙여요.** \"아, 나 지금 막막하구나.\" \"불안하구나.\" 소리 내도 좋고 속으로 해도 좋아요. 감정에 이름을 붙이기만 해도 감정 반응이 누그러진다는 연구가 있어요.\n2. **할 일을 '2분짜리'로 쪼개요.** \"공부하기\" 말고 \"책 펴서 소제목 하나만 읽기\"처럼요. 막막함은 일이 커서 생겨요. 작게 쪼개면 불안이 줄어요.\n3. **2분 하고 나서도 폰을 보고 싶으면, 그땐 봐도 돼요.** 다만 이번엔 '자동으로'가 아니라 '골라서' 보는 거예요.\n\n생각보다 자주, 2분이 10분이 될 거예요. 그 순간이 바로 느린 길에 첫발을 디딘 순간이에요.\n\n---\n\n그런데 그 느린 길 끝에는 정확히 뭐가 있을까요? 왜 어떤 날은 시간 가는 줄 모르고 빠져드는데, 어떤 날은 10분도 버거울까요?\n\n다음 장에서 몰파민의 정체를 본격적으로 열어 볼게요.\n\n---\n### 근거 메모 (본문 인용 전 원문 확인)\n- 도파민과 보상 예측 오차: Schultz, Dayan & Montague (1997), \"A neural substrate of prediction and reward\", *Science*.\n- '원함(wanting)'과 '좋아함(liking)'의 구분: Berridge & Robinson (1998), \"What is the role of dopamine in reward…?\", *Brain Research Reviews*.\n- 구매 전 상품을 볼 때의 보상 영역 반응: Knutson, Rick, Wimmer, Prelec & Loewenstein (2007), \"Neural predictors of purchases\", *Neuron*.\n- 감정에 이름 붙이기(affect labeling): Lieberman et al. (2007), \"Putting feelings into words\", *Psychological Science*.\n- 미루기 = 감정 회피(프롤로그와 연결): Sirois & Pychyl (2013).\n- '몰파민'은 저자가 만든 비유적 표현이며 학술 용어가 아님을 본문에 명시함.\n", "done": true}, {"title": "3장 – 몰파민이란 무엇인가", "card": "알고 싶었던 것: 몰입", "goal": "몰입이 일어나는 조건을 내 일에 옮긴다", "questions": ["시간 가는 줄 모르고 빠져든 일은?", "그 일은 쉬웠나요, 적당히 어려웠나요?", "끝나고 나서 기분은?"], "memo": ["게임", "적당히 어려웠다", "이기면 기분 좋고 지면 짜증나고, 시간 지난 걸 보면 현타 온다"], "draft": "# 3장 – 몰파민이란 무엇인가\n\n고백할 게 있어요.\n\n책 앞에서는 10분도 못 버티던 제가, 몇 시간이고 꼼짝 않고 빠져드는 게 하나 있었어요.\n\n**게임이요.**\n\n게임을 할 때 저는 집중력이 없는 사람이 아니었어요. 글자가 안 들어온다던 머리가, 게임 화면 속 작은 움직임 하나까지 다 잡아냈어요. 막막함도, 불안도 없었어요.\n\n게임은 **적당히 어려웠어요.** 너무 쉬우면 지루했을 거고, 너무 어려우면 그만뒀을 거예요. 딱 \"조금만 더 하면 이길 것 같은\" 난이도.\n\n이기면 기분이 좋았어요. 지면 짜증이 났어요. 그래서 한 판 더 했어요.\n\n그리고 문득 시계를 보면, 몇 시간이 지나 있었어요.\n\n**현타가 왔어요.**\n\n이상하지 않나요? 분명히 깊이 몰입했는데, 끝나고 남은 건 쇼핑 앱을 닫았을 때와 똑같은 후회였어요.\n\n그때 알았어요. **저는 몰입을 못 하는 사람이 아니었어요. 몰입할 줄 아는 뇌를 엉뚱한 곳에 쓰고 있었던 거예요.**\n\n---\n\n## 몰입은 우연이 아니라 조건이에요\n\n시간 가는 줄 모르고 빠져드는 상태를 심리학에서는 **몰입(flow)**이라고 불러요. 이걸 평생 연구한 심리학자 칙센트미하이는, 몰입이 아무 때나 오는 게 아니라 **조건이 맞을 때** 온다고 했어요.\n\n대표적인 조건은 세 가지예요.\n\n1. **목표가 분명하다.** 지금 뭘 해야 하는지 헷갈리지 않아요.\n2. **결과가 바로 보인다.** 잘했는지 못했는지 즉시 알 수 있어요.\n3. **난이도가 내 실력보다 살짝 높다.** 너무 쉬우면 지루하고, 너무 어려우면 불안해져요.\n\n이제 게임을 다시 볼까요.\n\n| 몰입의 조건 | 게임 | 내 공부 |\n|---|---|---|\n| 분명한 목표 | \"이 판을 이긴다\" | \"공부한다\" (막연함) |\n| 바로 보이는 결과 | 점수, 승패가 1초 만에 나옴 | 시험 날까지 모름 |\n| 딱 맞는 난이도 | 내 실력에 맞춰 상대가 정해짐 | 처음부터 너무 어렵거나, 어디가 어려운지도 모름 |\n\n**게임은 몰입의 세 조건을 전부 갖추도록 설계된 물건이었어요.** 제 공부는 세 개 다 빠져 있었고요.\n\n그러니까 제 뇌가 게임에는 빠지고 책에는 못 빠진 건 이상한 일이 아니었어요. 뇌는 정직하게, 조건이 맞는 쪽으로 갔을 뿐이에요.\n\n실제로 사람이 비디오 게임을 하는 동안 뇌에서 도파민이 분비된다는 걸 확인한 연구도 있어요. 몰입하는 동안 뇌는 분명히 보상을 받고 있었던 거예요.\n\n## 그런데 왜 현타가 왔을까\n\n여기서 중요한 질문이 남아요. 게임 몰입도 진짜 몰입이었는데, 왜 끝나고 후회가 남았을까요?\n\n저는 그 답을 **\"끝나고 나에게 뭐가 남았나\"**에서 찾았어요.\n\n게임이 끝나면 다음 날의 나는 어제와 똑같아요. 해야 할 일은 그대로고, 시간만 사라졌어요. 몰입은 했지만, 그 몰입이 **내가 가고 싶은 방향**과 연결되어 있지 않았던 거예요. 그 차이를 뇌는 귀신같이 알아채요. 그게 현타예요.\n\n반대로 몰입한 시간이 나에게 무언가를 남길 때가 있어요. 조금 더 잘하게 된 실력, 끝낸 과제, \"나 이거 할 수 있구나\" 하는 감각. 연구자들은 사람이 하루 중 가장 의욕이 높아지는 순간이 **의미 있는 일에서 작은 진전을 느낄 때**라고 말해요.\n\n그래서 저는 몰파민을 이렇게 정의하기로 했어요.\n\n> **몰파민 = 몰입의 조건을 갖춘 일 × 끝나고 나에게 남는 것**\n\n게임은 앞의 조건은 완벽했지만, 뒤가 비어 있었어요. 공부는 뒤는 채워 주지만, 앞의 조건이 하나도 없었고요.\n\n그렇다면 답은 하나예요. **게임이 몰입을 만드는 장치를, 내가 가고 싶은 일에 옮겨 심는 것.**\n\n---\n\n## 오늘의 몰파민 행동: 공부를 '한 판'으로 만들기\n\n게임에서 훔쳐 온 세 가지 장치를 오늘 공부에 그대로 붙여 보세요.\n\n1. **목표를 '한 판'으로 정해요.** \"공부하기\" 말고 \"25분 동안 문제 5개 풀기\"처럼, 끝이 보이는 판을 만들어요.\n2. **난이도를 조절해요.** 5개 중 3~4개는 풀 수 있을 것 같은 수준으로 골라요. 너무 어려우면 쉬운 걸로 바꾸는 건 반칙이 아니라 전략이에요.\n3. **결과를 바로 확인해요.** 한 판이 끝나면 바로 채점하고, 종이에 점수를 적어요. \"오늘 1판: 4/5.\" 이게 게임의 점수판이에요.\n\n그리고 한 판이 끝났을 때, 스스로에게 딱 하나만 물어보세요.\n\n**\"지금 기분이 현타 쪽이야, 뿌듯함 쪽이야?\"**\n\n뿌듯함 쪽이었다면, 축하해요. 그게 몰파민이에요.\n\n---\n\n그런데 게임을 할 때 하나 더 있었죠. 이기면 기분이 좋고, 지면 짜증이 나는 것. 그 오르락내리락은 게임이 끝나도 하루 종일 저를 따라다녔어요.\n\n다음 장에서는 몰입을 가장 자주 무너뜨리는 것, 감정기복 이야기를 해 볼게요.\n\n---\n### 근거 메모 (본문 인용 전 원문 확인)\n- 몰입(flow)의 조건 – 분명한 목표, 즉각적 피드백, 도전과 실력의 균형: Csikszentmihalyi (1990), *Flow: The Psychology of Optimal Experience*.\n- 비디오 게임 중 선조체 도파민 분비: Koepp et al. (1998), \"Evidence for striatal dopamine release during a video game\", *Nature*.\n- 의미 있는 일의 작은 진전이 동기를 높임(진전의 원리): Amabile & Kramer (2011), *The Progress Principle*.\n- '몰파민 = 몰입 조건 × 남는 것'은 저자의 정의이며 학술 공식이 아님.\n", "done": true}, {"title": "4장 – 감정기복은 뇌의 날씨다", "card": "지금 힘든 것", "goal": "무기력한 날에도 할 수 있는 한 가지를 안다", "questions": ["최근 감정이 크게 흔들린 순간은?", "그때 몸이나 행동은?", "그 기분이 얼마나 갔고 할 일에 어떤 영향을 줬나요?"], "memo": ["사소한 일에도 감정적이 된다", "아무 말도 하기 싫고, 핸드폰을 보거나 핸드폰도 잘 안 보고 만사 귀찮고 무기력하다", "미루는 습관이 생기기 시작했고 행동을 잘 하지 않게 됐다"], "draft": "# 4장 – 감정기복은 뇌의 날씨다\n\n이 장은 다 지나온 이야기가 아니에요. 지금도 제가 겪고 있는 이야기예요.\n\n요즘의 저는 이래요.\n\n사소한 일에도 감정적이 돼요. 별것 아닌 말 한마디, 작은 실수 하나에 마음이 크게 출렁여요. 그러고 나면 **아무 말도 하기 싫어져요.**\n\n폰을 붙잡고 있을 때도 있어요. 그런데 더 이상한 건, **폰조차 잘 안 보게 되는 날**이에요. 쇼핑 앱도, 게임도 재미가 없어요. 만사가 다 귀찮아요.\n\n무기력해요. 해야 할 일은 하나둘 미뤄지고, 미루는 게 습관처럼 굳어 가요. 그러다 보니 **행동 자체를 잘 하지 않게 됐어요.**\n\n몰입에 대한 책을 쓰는 사람이 이런 고백을 해도 될까 고민했어요. 그런데 생각해 보면, 이 책을 펼친 당신도 어쩌면 지금 이런 날들 속에 있을지 몰라요. 그래서 다 나은 사람의 말 대신, **흔들리는 사람이 흔들리면서 붙잡는 방법**을 쓰기로 했어요.\n\n먼저 이것부터 말하고 싶어요.\n\n**감정기복은 내가 약해서 생기는 게 아니에요. 뇌의 날씨예요. 날씨는 내 잘못이 아니지만, 우산은 내가 고를 수 있어요.**\n\n---\n\n## 뇌는 몸의 '잔고'를 보고 기분을 만들어요\n\n뇌가 하는 가장 중요한 일이 뭘까요. 생각하기? 공부하기? 뇌과학자 리사 펠드먼 배럿은 뇌의 가장 중요한 일이 **몸의 에너지를 관리하는 것**이라고 말해요. 마치 통장 잔고를 관리하듯이요. 그녀는 이걸 '몸의 예산'이라고 불러요.\n\n잠을 못 잤을 때, 끼니를 거를 때, 며칠째 햇빛을 못 봤을 때, 마음 쓰는 일이 겹칠 때. 몸의 잔고가 바닥나요. 그러면 뇌는 우리에게 신호를 보내요. 불쾌함, 예민함, 귀찮음. **\"지금 잔고가 없어, 아껴!\"** 하고요.\n\n그러니까 사소한 일에 감정적이 되는 건, 그 일이 커서가 아니라 **그 순간 내 잔고가 바닥이었기 때문**일 때가 많아요. 실제로 잠을 하룻밤만 못 자도 감정을 담당하는 뇌 영역이 훨씬 더 크게 반응한다는 연구가 있어요. 같은 말을 들어도, 잔고가 비어 있는 날에는 더 아프게 들리는 거예요.\n\n## 무기력은 뇌가 '절전 모드'에 들어간 거예요\n\n아무 말도 하기 싫고, 폰도 재미없고, 만사가 귀찮은 상태. 저는 이걸 오랫동안 게으름이라고 불렀어요.\n\n그런데 잔고 이야기로 보면 다르게 보여요. 잔고가 계속 바닥이면 뇌는 **절전 모드**에 들어가요. 말하는 데 드는 에너지, 움직이는 데 드는 에너지, 심지어 재미를 느끼는 데 드는 에너지까지 아끼려고 해요. 그래서 2장에서 말한 빠른 도파민조차 시들해지는 날이 오는 거예요.\n\n여기서 우리가 흔히 빠지는 함정이 있어요.\n\n> \"기분이 나아지면 움직여야지.\"\n\n그런데 절전 모드의 뇌는 기분을 먼저 올려 주지 않아요. 기다릴수록 움직임은 줄고, 움직임이 줄수록 잔고를 채울 기회도 줄어요. 미루기가 습관이 되는 건 이 고리 때문이에요.\n\n## 순서를 뒤집어요: 행동이 먼저, 기분은 나중에\n\n우울과 무기력을 다루는 심리치료 중에 **'행동 활성화'**라는 방법이 있어요. 핵심은 아주 단순해요.\n\n**기분이 좋아져서 움직이는 게 아니라, 움직이니까 기분이 따라온다.**\n\n거창한 행동이 아니에요. 잔고를 아주 조금 채워 주는, 작고 구체적인 행동이요. 연구에서도 이렇게 작은 행동부터 쌓아 가는 방법이 우울한 기분을 줄이는 데 효과가 있다고 알려져 있어요.\n\n3장에서 몰파민은 \"몰입할 수 있는 조건 × 끝나고 남는 것\"이라고 했죠. 잔고가 바닥인 날에는 몰입까지 가기 어려워요. 그래서 이런 날의 목표는 몰입이 아니라 **잔고를 1만큼 채우는 것**이에요. 그게 다음 날의 몰입을 위한 저금이에요.\n\n---\n\n## 오늘의 몰파민 행동: 잔고 1 채우기\n\n무기력한 날에는 거창한 계획은 잊으세요. 딱 이것만 해 보세요.\n\n1. **날씨를 이름 붙여요.** \"아, 오늘은 내 뇌에 비가 오는구나.\" 내가 이상한 게 아니라 날씨가 나쁜 거예요. 자책은 잔고를 더 깎아요.\n2. **잔고 체크 세 가지를 확인해요.** 어젯밤 잠은 잤나? 오늘 뭐라도 먹었나? 오늘 햇빛을 봤나? 하나라도 \"아니오\"라면, 그게 오늘의 할 일이에요.\n3. **5분짜리 행동 하나만 해요.** 창문 열기, 세수하기, 집 앞까지 걸어 나갔다 오기. 그 이상은 하지 않아도 돼요. 했다면 종이에 체크 하나.\n\n비 오는 날 우산을 쓴다고 비가 그치진 않아요. 하지만 덜 젖어요. 그리고 체크가 쌓인 종이는, 다음 비 오는 날 \"그때도 지나갔다\"는 증거가 돼요.\n\n---\n\n> **잠깐, 꼭 하고 싶은 말이 있어요.**\n> 이런 무기력과 감정 변화가 2주 넘게 거의 매일 이어지거나, 일상생활이 어려울 만큼 힘들다면 혼자 버티지 마세요. 정신건강의학과나 상담 기관의 도움을 받는 건 약해서가 아니라, 가장 큰 우산을 쓰는 거예요. 마음이 많이 힘들 땐 정신건강 위기상담 전화 **109**(24시간)에서도 이야기를 들어 줘요.\n\n---\n\n비가 그친 뒤에도 마음에 남는 게 있어요. 예전에 들었던 말, 지나간 상처, \"나는 원래 이런 사람이야\"라는 생각. 그런데 그 생각들도 과연 사실일까요?\n\n다음 장에서는 뇌가 상처를 어떻게 '해석'하는지, 그리고 그 해석을 어떻게 다시 쓸 수 있는지 이야기해 볼게요.\n\n---\n### 근거 메모 (본문 인용 전 원문 확인)\n- 뇌의 핵심 기능 = 몸의 예산(body budget) 관리, 감정은 그 예측에서 구성됨: Barrett (2017), *How Emotions Are Made*; Barrett (2020), *Seven and a Half Lessons About the Brain*.\n- 수면 박탈 후 편도체 반응 증가: Yoo, Gujar, Hu, Jolesz & Walker (2007), \"The human emotional brain without sleep\", *Current Biology*.\n- 행동 활성화(behavioral activation)의 우울 감소 효과: Dimidjian et al. (2006), *Journal of Consulting and Clinical Psychology*; Ekers et al. (2014) 메타분석, *PLoS ONE*.\n- 109 = 보건복지부 자살예방 상담전화 (2024년 1월부터 통합 번호). 출간 전 번호와 운영 시간 재확인.\n- 이 장은 저자가 현재 겪고 있는 경험을 바탕으로 하며, 치료 방법을 제시하지 않음.\n", "done": true}, {"title": "5장 – 상처도 뇌의 해석이다: 내 해석을 다시 쓰는 법", "card": "이제는 아닌 상처", "goal": "지나간 상처를 다르게 해석하는 연습을 한다", "questions": ["예전에 나를 가장 아프게 했던 말이나 일은?", "그때 나는 그 일을 보고 '나는 ___한 사람이다'라고 생각했나요?", "지금은 그 일을 어떻게 다르게 보나요?"], "memo": ["", "", ""], "draft": "", "done": false}, {"title": "6장 – 몰파민 루틴 7일: 하루 1시간 몰입 만들기", "card": "실천", "goal": "7일 동안 따라 할 수 있는 루틴을 얻는다", "questions": ["7일 동안 매일 한 행동과 기분 전/후는?", "가장 효과가 있었던 행동은?", "7일 뒤 달라진 점은?"], "memo": ["1일차: 창문 열기, 세수 → 기분이 확실히 전보다 좋아짐", "", ""], "draft": "", "done": false}, {"title": "에필로그 – 이제는 아닌 상처", "card": "전체", "goal": "책을 덮고도 남는 한 문장을 얻는다", "questions": ["이 책을 쓰기 전과 후, 나는 무엇이 달라졌나요?", "지금 감정기복과 어떻게 지내고 있나요?", "독자에게 꼭 하고 싶은 한 문장은?"], "memo": ["", "", ""], "draft": "", "done": false}], "cover": {"bg": "#0F3D36", "ink": "#F3F0E6", "accent": "#F3D35B", "confirmed": false}, "coverIdeas": null, "exported": false}</script>
<script>
(function(){
"use strict";
const KEY="ebookgen.v1";
const SEED=JSON.parse(document.getElementById("seed").textContent);
const BLANK={
  v:1, step:0, cards:{know:"",fun:"",weak:"",healed:"",hard:""},
  topic:{core:"",promise:"",title:"",subtitle:"",reader:"",author:""},
  topicDraft:null, research:"", toc:[], cur:0,
  cover:{bg:"#0F3D36",ink:"#F3F0E6",accent:"#F3D35B",confirmed:false}, coverIdeas:null, exported:false
};
const clone=o=>JSON.parse(JSON.stringify(o));
let S=load()||clone(SEED);
let SAMPLE, DL;
let busy=null; // {key, ctl}
const STEPS=["팔리는 주제","주제 리서치","목차 설계","원고 집필","표지 디자인","본문 디자인"];
const CARD_LABELS=[["know","알고 싶었던 것"],["fun","재밌게 할 수 있는 분야"],["weak","겪은 약점·고민"],["healed","이제는 아닌 상처"],["hard","지금 힘든 것"]];
const PRESETS=[
  {name:"깊은 숲",bg:"#0F3D36",ink:"#F3F0E6",accent:"#F3D35B"},
  {name:"새벽 남색",bg:"#1C2340",ink:"#EEF0F7",accent:"#7FD3C4"},
  {name:"맑은 종이",bg:"#F2EFE7",ink:"#1B2420",accent:"#D2483A"}
];

/* ---------- storage ---------- */
function load(){try{const r=localStorage.getItem(KEY);if(!r)return null;const o=JSON.parse(r);return o&&o.v===1?Object.assign(clone(BLANK),o):null}catch(e){return null}}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{
  try{localStorage.setItem(KEY,JSON.stringify(S));stamp("자동 저장됨")}catch(e){stamp("이 브라우저에선 자동 저장이 안 돼요. 작업 파일로 저장해 주세요")}
  progress();
},350)}
function stamp(t){const d=new Date();document.getElementById("saved").textContent=t+" · "+d.toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"})}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function getP(path){return path.split(".").reduce((o,k)=>o==null?o:o[k],S)}
function setP(path,val){const ks=path.split(".");let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function chars(s){return (s||"").replace(/\s/g,"").length}
function chapStatus(c){if(c.done)return["done","완성"];if((c.draft||"").trim())return["draft","초안"];if((c.memo||[]).some(m=>(m||"").trim()))return["memo","메모"];return["","메모 전"]}

/* ---------- markdown ---------- */
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,"$1<em>$2</em>").replace(/`([^`]+)`/g,"<code>$1</code>")}
function md(src){
  const L=(src||"").replace(/\r/g,"").split("\n");let out=[],i=0;
  while(i<L.length){
    let l=L[i];
    if(!l.trim()){i++;continue}
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)/))){const n=Math.min(m[1].length,3);out.push(`<h${n}>${inline(m[2])}</h${n}>`);i++;continue}
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){out.push("<hr>");i++;continue}
    if(/^\s*>/.test(l)){let b=[];while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,""));i++}out.push("<blockquote>"+md(b.join("\n"))+"</blockquote>");continue}
    if(/^\s*\|/.test(l)){let rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++}
      rows=rows.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r.replace(/\|/g,"").trim()?r:"---"));
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
      let h=rows.shift();let html="<div class='tbl'><table><thead><tr>"+cells(h).map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>";
      rows.forEach(r=>{if(/^\s*\|?[\s:\-|]+$/.test(r))return;html+="<tr>"+cells(r).map(c=>"<td>"+c+"</td>").join("")+"</tr>"});
      out.push(html+"</tbody></table></div>");continue}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ol=/^\s*\d+\./.test(l);let it=[];while(i<L.length&&/^\s*([-*]|\d+\.)\s+/.test(L[i])){it.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/,""));i++}
      out.push((ol?"<ol>":"<ul>")+it.map(x=>"<li>"+inline(x)+"</li>").join("")+(ol?"</ol>":"</ul>"));continue}
    let p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|\s*>|\s*\||\s*([-*]|\d+\.)\s+|\s*-{3,}\s*$)/.test(L[i])){p.push(inline(L[i]));i++}
    if(p.length)out.push("<p>"+p.join("<br>")+"</p>");else{out.push("<p>"+inline(l)+"</p>");i++}
  }
  return out.join("\n");
}

/* ---------- prompts ---------- */
function cardsText(){return CARD_LABELS.map(([k,l])=>`- ${l}: ${S.cards[k]||"(비어 있음)"}`).join("\n")}
function bookText(){const t=S.topic;return `제목: ${t.title}\n부제: ${t.subtitle}\n약속 문장: ${t.promise}\n핵심 메시지: ${t.core}\n독자: ${t.reader}`}

const ERR={not_granted:"Claude 사용을 허용하지 않아서 생성이 꺼졌어요. 직접 쓰거나 '프롬프트 복사'를 써 주세요.",sampling_disabled:"이 계정에선 Claude 생성을 쓸 수 없어요.",rate_limited:"요청이 많아요. 잠시 뒤에 다시 눌러 주세요.",session_expired:"다시 로그인한 뒤 눌러 주세요.",refused:"Claude가 이 내용으로는 답하지 않았어요. 메모를 조금 바꿔서 다시 해 보세요.",invalid_json:"결과 형식이 깨졌어요. 한 번 더 눌러 주세요.",empty_completion:"빈 답이 왔어요. 다시 눌러 주세요.",prompt_too_large:"내용이 너무 길어요. 리서치 메모를 줄여 주세요.",upstream_error:"연결이 잠깐 끊겼어요. 다시 눌러 주세요."};
function setStatus(key,t,err){const el=document.getElementById("st-"+key);if(el){el.textContent=t;el.classList.toggle("err",!!err)}}
async function gen(key,prompt,{json=false,onText,cache=true}={}){
  if(!SAMPLE){toast("여기서는 Claude 생성을 쓸 수 없어요. '프롬프트 복사'를 써 주세요.");return null}
  if(busy){toast("다른 생성이 진행 중이에요.");return null}
  const ctl=new AbortController();busy={key,ctl};paintBusy();
  setStatus(key,"Claude가 생각하는 중… (보통 10~60초)");
  try{
    const opts={signal:ctl.signal,cache};
    if(onText)opts.onText=u=>{setStatus(key,"쓰는 중… "+chars(u.text).toLocaleString()+"자");onText(u.text)};
    const r=json?await SAMPLE.json(prompt,opts):await SAMPLE(prompt,opts);
    if(!json&&r.truncated)setStatus(key,"길이 제한으로 끝이 잘렸어요. 이어서 직접 다듬어 주세요.",true);else setStatus(key,"완료");
    return json?r:r.text;
  }catch(e){
    if(e&&e.code==="cancelled"){setStatus(key,"멈췄어요.");return onText&&e.text?e.text:null}
    setStatus(key,ERR[e&&e.code]||"생성에 실패했어요. 다시 눌러 주세요.",true);
    return onText&&e&&e.text?e.text:null;
  }finally{busy=null;paintBusy()}
}
function paintBusy(){document.querySelectorAll("[data-gen]").forEach(b=>{b.disabled=!!busy||!SAMPLE});document.querySelectorAll("[data-stop]").forEach(b=>b.hidden=!busy||busy.key!==b.dataset.stop)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("복사했어요. Claude 대화창에 붙여넣으세요.")}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.append(ta);ta.select();try{document.execCommand("copy");toast("복사했어요.")}catch(_){toast("복사가 막혀 있어요.")}ta.remove()}}
function genRow(key,label,extra=""){return `<div class="row"><button class="primary" type="button" data-act="gen-${key}" data-gen>${label}</button><button type="button" data-stop="${key}" data-act="stop" hidden>멈추기</button><button class="ghost" type="button" data-act="copy-${key}">프롬프트 복사</button>${extra}</div><div class="status" id="st-${key}"></div>`}

/* ---------- progress ---------- */
function stepDone(){
  const t=S.toc, done=t.filter(c=>c.done).length;
  return [!!S.topic.title.trim(), !!S.research.trim(), t.length>0, t.length?done/t.length:0, !!S.cover.confirmed, !!S.exported];
}
function progress(){
  const d=stepDone();const pct=Math.round(d.reduce((a,b)=>a+(b===true?1:b===false?0:b),0)/6*100);
  $("#pfill").style.width=pct+"%";$("#ptext").textContent=pct+"%";
  const t=S.topic;$("#bookline").innerHTML=t.title?`<b>${esc(t.title)}</b>${t.subtitle?" – "+esc(t.subtitle):""}`:"아직 제목이 없어요";
  document.querySelectorAll(".step").forEach((b,i)=>b.classList.toggle("done",d[i]===true||d[i]===1));
}

}
function vBook(){
  const t=S.toc,done=t.filter(c=>c.done).length,total=t.reduce((a,c)=>a+chars(c.draft),0),checks=t.reduce((a,c)=>a+((c.draft||"").match(/\[저자 확인/g)||[]).length,0);
  return `<div class="head"><h2>본문 디자인</h2><p>표지, 목차, 원고를 A4 전자책 한 권으로 묶어요. 책 파일(.html)을 저장해 크롬에서 열고 ⌘P(윈도우는 Ctrl+P) → "PDF로 저장"을 고르면 PDF가 돼요.</p></div>
  <div class="stats">
    <div class="stat"><div class="v">${done}/${t.length}</div><div class="k">완성한 꼭지</div></div>
    <div class="stat"><div class="v">${total.toLocaleString()}</div><div class="k">글자 수 (공백 제외)</div></div>
    <div class="stat"><div class="v">${Math.round(total/1100)+2}</div><div class="k">예상 쪽수 (A4)</div></div>
    <div class="stat"><div class="v">${checks}</div><div class="k">남은 [저자 확인]</div></div>
  </div>
  ${done<t.length?`<div class="note warn">아직 완성 표시가 안 된 꼭지가 ${t.length-done}개 있어요. 지금 저장하면 쓴 만큼만 들어가요.</div>`:""}
  <div class="row"><button type="button" class="primary" data-act="export-html">책 파일 저장 (.html → PDF)</button><button type="button" data-act="export-md">원고 저장 (.md)</button></div>
  <div class="bookview">
    <div class="page" style="padding:0;background:none;box-shadow:none;max-width:320px">${coverHTML(true)}</div>
    <div class="page prose"><h1>차례</h1>${t.map(c=>`<p>${esc(c.title)}</p>`).join("")}</div>
    ${t.filter(c=>(c.draft||"").trim()).map(c=>`<div class="page prose">${md(c.draft)}</div>`).join("")}
  </div>`;
}
function render(){
  rail();progress();
  $("#main").innerHTML=`<div class="panel">${[vTopic,vResearch,vToc,vWrite,vCover,vBook][S.step]()}</div>`;
  paintBusy();
  if(SAMPLE===null){const n=document.createElement("div");n.className="note";n.textContent="이 화면에서는 Claude 생성이 꺼져 있어요. 직접 쓰거나 '프롬프트 복사'로 Claude 대화창에 붙여넣어 쓰세요.";$("#main .panel").insertBefore(n,$("#main .panel").children[1])}
}

/* ---------- export ---------- */
function bookDoc(){
  const t=S.topic,c=S.cover;
  const chaps=S.toc.filter(x=>(x.draft||"").trim());
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(t.title)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&display=swap">
<style>@page{size:A4;margin:22mm 20mm}body{font-family:"Gowun Batang",serif;color:#1b2420;font-size:11.5pt;line-height:1.85;margin:0}
.cover{page-break-after:always;height:250mm;background:${c.bg};color:${c.ink};padding:30mm 22mm;display:flex;flex-direction:column;justify-content:space-between;-webkit-print-color-adjust:exact;print-color-adjust:exact;box-sizing:border-box}
@media print{.cover{margin:-22mm -20mm 0;height:297mm;width:210mm}}
.cover h1{font-size:54pt;line-height:1.1;margin:0;word-break:keep-all}.cover p{font-family:"IBM Plex Sans KR",sans-serif;font-size:14pt;margin:14px 0 0;word-break:keep-all}.cover i{display:block;width:50px;height:5px;background:${c.accent};margin-top:24px}.cover span{font-family:"IBM Plex Sans KR",sans-serif;font-size:12pt}
.toc{page-break-after:always}.toc h2{font-size:20pt}.toc li{margin:6px 0}
section{page-break-before:always;max-width:160mm;margin:0 auto}section h1{font-size:20pt;line-height:1.4;margin:0 0 20px;word-break:keep-all}h2{font-size:14pt;margin:26px 0 8px}h3{font-size:12pt}
blockquote{margin:0 0 12px;padding:10px 14px;background:#eef1ec;border-radius:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}blockquote p{margin:0}
table{border-collapse:collapse;font-family:"IBM Plex Sans KR",sans-serif;font-size:9.5pt;margin:0 0 12px}th,td{border:1px solid #c9d1c8;padding:5px 8px;text-align:left;vertical-align:top}
hr{border:none;border-top:1px solid #c9d1c8;margin:20px 0}p{margin:0 0 11px}</style></head><body>
<div class="cover"><div><h1>${esc(t.title)}</h1><p>${esc(t.subtitle)}</p><i></i></div><span>${esc(t.author)}</span></div>
<div class="toc"><h2>차례</h2><ol style="list-style:none;padding:0">${chaps.map(x=>`<li>${esc(x.title)}</li>`).join("")}</ol></div>
${chaps.map(x=>`<section>${md(x.draft)}</section>`).join("\n")}
</body></html>`;
}
function bookMd(){const t=S.topic;return `# ${t.title}\n## ${t.subtitle}\n\n${t.author?"저자: "+t.author+"\n\n":""}`+S.toc.filter(x=>(x.draft||"").trim()).map(x=>x.draft.trim()).join("\n\n---\n\n")}
async function offer(filename,data){
  if(!DL){await copyText(data);toast("이 화면에선 파일 저장이 안 돼서 내용을 복사했어요.");return false}
  try{await DL.save({filename,data});toast("저장했어요.");return true}
  catch(e){if(e&&e.code==="declined")toast("저장을 취소했어요.");else if(e&&e.code==="rate_limited")toast("잠시 뒤에 다시 눌러 주세요.");else{await copyText(data);toast("파일 저장이 막혀서 내용을 복사했어요.")}return false}
}
const fname=ext=>(S.topic.title||"전자책").replace(/[\\/:*?"<>|]/g,"").trim()+ext;

/* ---------- events ---------- */
function armed(btn){
  if(!btn.dataset.confirm)return true;
  if(btn.classList.contains("armed")){btn.classList.remove("armed");btn.textContent=btn.dataset.orig;return true}
  btn.dataset.orig=btn.textContent;btn.textContent=btn.dataset.confirm;btn.classList.add("armed");
  setTimeout(()=>{if(btn.classList.contains("armed")){btn.classList.remove("armed");btn.textContent=btn.dataset.orig}},3500);
  return false;
}
document.addEventListener("input",e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  setP(k,e.target.value);save();
  if(k.startsWith("cover.")){$("#coverbox").innerHTML=coverHTML();S.cover.confirmed=false}
  if(/^toc\.\d+\.draft$/.test(k)){const c=S.toc[S.cur];const cc=$("#cc");if(cc)cc.textContent=`${chars(c.draft).toLocaleString()}자 · 약 ${(chars(c.draft)/1100).toFixed(1)}쪽`}
  if(/^topic\.(title|subtitle)$/.test(k))progress();
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i;
  if(a==="step"){S.step=i;save();render();window.scrollTo({top:0});return}
  if(a==="stop"){busy&&busy.ctl.abort();return}
  if(a==="gen-topic"){const r=await gen("topic",P.topic(),{json:true});if(r&&r.titles){S.topicDraft=r;if(!S.topic.core)S.topic.core=r.core||"";if(!S.topic.reader)S.topic.reader=r.reader||"";save();render();setStatus("topic","완료. 아래에서 골라 주세요.")}return}
  if(a==="copy-topic")return copyText(P.topic());
  if(a==="pick-promise"){S.topic.promise=S.topicDraft.promises[i].text;save();render();return}
  if(a==="pick-title"){const t=S.topicDraft.titles[i];S.topic.title=t.title;S.topic.subtitle=t.subtitle;save();render();return}
  if(a==="gen-research"){const ta=$("#research");const old=S.research;const r=await gen("research",P.research(),{onText:t=>{ta.value=t},cache:false});S.research=r||old;ta.value=S.research;save();return}
  if(a==="copy-research")return copyText(P.research());
  if(a==="gen-toc"){
    if(S.toc.some(c=>(c.draft||"").trim())){b.dataset.confirm=b.dataset.confirm||"원고가 사라져요. 한 번 더 누르세요";if(!armed(b))return}
    const r=await gen("toc",P.toc(),{json:true,cache:false});
    if(Array.isArray(r)&&r.length){S.toc=r.map(c=>({title:String(c.title||""),card:String(c.card||""),goal:String(c.goal||""),questions:(c.questions||[]).slice(0,3).map(String),memo:["","",""],draft:"",done:false}));S.cur=0;save();render();setStatus("toc","완료. 제목과 질문은 바로 고칠 수 있어요.")}
    return}
  if(a==="copy-toc")return copyText(P.toc());
  if(a==="up"&&i>0){[S.toc[i-1],S.toc[i]]=[S.toc[i],S.toc[i-1]];save();render();return}
  if(a==="down"&&i<S.toc.length-1){[S.toc[i+1],S.toc[i]]=[S.toc[i],S.toc[i+1]];save();render();return}
  if(a==="del"){if(!armed(b))return;S.toc.splice(i,1);save();render();return}
  if(a==="add"){S.toc.push({title:"새 꼭지",card:"",goal:"",questions:["그 순간 어떤 상황이었나요?","몸과 기분은 어땠나요?","그때 나에게 한 말 한 문장은?"],memo:["","",""],draft:"",done:false});save();render();return}
  if(a==="cur"){S.cur=i;save();render();return}
  if(a==="mode"){S.mode=b.dataset.m;save();render();return}
  if(a==="done"){S.toc[S.cur].done=b.checked;save();render();return}
  if(a==="gen-draft"){
    const c=S.toc[S.cur];
    if((c.draft||"").trim()){b.dataset.confirm=b.dataset.confirm||"지금 원고를 바꿔요. 한 번 더";if(!armed(b))return}
    if(!(c.memo||[]).some(m=>(m||"").trim())){setStatus("draft","질문에 한 줄이라도 답해 주세요. 메모가 있어야 내 이야기가 들어가요.",true);return}
    S.mode="edit";const idx=S.cur;const old=c.draft;render();
    const r=await gen("draft",P.draft(idx),{cache:false,onText:t=>{const ta=document.getElementById("draft-"+idx);if(ta)ta.value=t}});
    S.toc[idx].draft=r||old;S.toc[idx].done=false;save();
    const st=document.getElementById("st-draft")?.textContent;render();if(st)setStatus("draft",st);
    return}
  if(a==="copy-draft")return copyText(P.draft(S.cur));
  if(a==="preset"){const p=[...PRESETS,...(S.coverIdeas||[])][i];Object.assign(S.cover,{bg:p.bg,ink:p.ink,accent:p.accent,confirmed:false});save();render();return}
  if(a==="gen-cover"){const r=await gen("cover",P.cover(),{json:true});if(Array.isArray(r)){S.coverIdeas=r.filter(p=>/^#[0-9a-f]{6}$/i.test(p.bg)&&/^#[0-9a-f]{6}$/i.test(p.ink)&&/^#[0-9a-f]{6}$/i.test(p.accent)).slice(0,3);save();render();setStatus("cover","완료. 위에 추천 색이 추가됐어요.")}return}
  if(a==="copy-cover")return copyText(P.cover());
  if(a==="cover-ok"){S.cover.confirmed=true;save();render();return}
  if(a==="export-html"){if(await offer(fname(".html"),bookDoc())){S.exported=true;save();progress()}return}
  if(a==="export-md"){await offer(fname(".md"),bookMd());return}
});
$("#btn-save").onclick=()=>offer(fname("_작업파일.json"),JSON.stringify(S,null,1));
$("#btn-load").onclick=()=>$("#file-in").click();
$("#file-in").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.v!==1||!o.cards)throw 0;S=Object.assign(clone(BLANK),o);save();render();toast("작업 파일을 불러왔어요.")}catch(_){toast("이 생성기에서 저장한 작업 파일(.json)이 아니에요.")}};r.readAsText(f);e.target.value=""};
$("#btn-new").onclick=e=>{if(!armed(e.currentTarget))return;S=clone(BLANK);save();render();toast("새로 시작해요. 01 단계부터 채워 주세요.")};

/* ---------- boot ---------- */
render();stamp(load()?"이어서 작업 중":"몰파민 원고를 불러왔어요");
(async()=>{
  try{SAMPLE=window.claude?await window.claude.use("sample"):null}catch(_){SAMPLE=null}
  try{DL=window.claude?await window.claude.use("downloads"):null}catch(_){DL=null}
  render();
})();
})();
</script>
